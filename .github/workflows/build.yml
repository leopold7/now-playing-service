name: Build NowPlayingService

on:
  push:
    branches: [ dev, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 17 用于运行 Maven（launch4j-maven-plugin 2.7.0 要求 Java 17 来加载插件本身）；
      # 项目 source/target 仍为 11，故产出的 jar 仍为 Java 11 字节码，运行只需 JRE 11。
      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # .NET 8 SDK 用于编译 C# 的 GetMusicStatus（目标框架 net8.0-windows10.0.26100.0）
      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 安装 Maven（windows runner 默认未预装）
      - name: Install Maven
        run: choco install maven -y
        shell: powershell

      # 1) 编译 Java 后端，产出 target/now-playing-0.0.1-SNAPSHOT.jar，
      #    并由 launch4j-maven-plugin 在 package 阶段直接生成 NowPlayingService.exe
      - name: Build Java backend (Maven)
        run: mvn -B clean package -DskipTests

      # 2) 编译 C# 的 GetMusicStatus 并直接发布到 Assets/AudioService/，
      #    覆盖其中的 GetMusicStatus.exe（包含 YuXiaoManService 的时长修复）
      - name: Publish GetMusicStatus (self-contained, win-x64)
        run: dotnet publish external_programs/AudioService/GetMusicStatus/GetMusicStatus.csproj -c Release -r win-x64 --self-contained -o Assets/AudioService

      # 3) 直接上传 Assets 目录：upload-artifact 会自动打包成名为 Assets.zip 的 artifact，
      #    解压后即为 Assets/ 文件夹，避免再手动 Compress-Archive 造成双层嵌套。
      - name: Upload Assets
        uses: actions/upload-artifact@v4
        with:
          name: Assets
          path: Assets
          if-no-files-found: error

      - name: Upload NowPlayingService.exe
        uses: actions/upload-artifact@v4
        with:
          name: NowPlayingService
          path: NowPlayingService.exe
          if-no-files-found: error
